[project]
name = "notebooks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "greenstone",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
